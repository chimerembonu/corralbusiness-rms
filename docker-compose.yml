# CorralBusiness – RMS store server. Start with:  docker compose up -d
# Everything listens only on the restaurant network: set RMS_BIND_IP in .env to the server's LAN address.
name: corralbusiness-rms

x-app: &app
  image: corralbusiness-rms:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
    - ./docker/cups:/run/cups:ro          # host CUPS socket (USB printers); harmless when empty
    - /media:/media                      # USB sticks plugged into the server (backup copies)
  depends_on:
    db:
      condition: service_healthy
  networks: [rms]

services:
  app:
    <<: *app
    environment:
      RMS_ROLE: app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${RMS_BIND_IP:-0.0.0.0}:${RMS_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
    networks: [rms]

  queue:
    <<: *app
    environment:
      RMS_ROLE: queue
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    environment:
      RMS_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *app
    environment:
      RMS_ROLE: reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-corralbusiness_rms}
      MYSQL_USER: ${DB_USERNAME:-rms}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [rms]

volumes:
  mysql:
  storage:

networks:
  rms:
