# Builds the store-server image on every push so a broken Dockerfile is caught before install day.
name: Store-server image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - docker-compose.yml
      - .dockerignore
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .github/workflows/docker-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create the .env the compose file expects
        run: cp .env.docker.example .env

      - name: Build the images (app and web)
        env:
          DB_PASSWORD: ci-only
          DB_ROOT_PASSWORD: ci-only
        run: docker compose build

      - name: Check the web image carries the compiled front-end
        run: docker run --rm --entrypoint sh corralbusiness-rms-web:latest -c 'test -f /var/www/html/public/build/manifest.json && nginx -t'

      - name: Check PHP and extensions inside the image
        run: |
          docker run --rm --entrypoint php corralbusiness-rms:latest -v
          docker run --rm --entrypoint php corralbusiness-rms:latest -m | grep -E -i "^(gd|pdo_mysql|bcmath|intl|zip|pcntl|sockets|Zend OPcache|exif)$"
          docker run --rm --entrypoint composer corralbusiness-rms:latest check-platform-reqs --no-dev
