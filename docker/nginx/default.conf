# nginx in front of php-fpm (service "app") and the Reverb WebSocket server (service "reverb"). Plain http:
# used when HTTPS is off (the default). With RMS_HTTPS=on, 30-rms-https.sh swaps in https.conf at start.
server_tokens off; # do not advertise the nginx version (security review L5)

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;

    include /etc/nginx/rms/app-locations.inc;
}
