# HTTPS on the restaurant network (Complete Edition E9.1). Switched in by 30-rms-https.sh when RMS_HTTPS=on
# and the certificates made by scripts/https.sh are present.
server_tokens off;

# Plain http stays open only for what a device needs BEFORE it trusts the restaurant's certificate: the device
# setup page and the certificate itself. Every other address goes to the device setup page, which moves a device
# that already trusts the certificate straight on to https (and shows the steps to one that does not yet).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    absolute_redirect off; # keep the address and port the device used (e.g. :8080 behind another port)

    location = /device-setup { include /etc/nginx/rms/php.inc; }
    location = /device-setup/certificate { include /etc/nginx/rms/php.inc; }
    location /build/ { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location / { return 302 /device-setup?next=$uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/certs/public/server.crt;
    ssl_certificate_key /etc/nginx/certs/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rms_tls:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/rms/app-locations.inc;
}
