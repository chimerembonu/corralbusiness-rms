; CorralBusiness – RMS: PHP settings for the store server.
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
date.timezone = Africa/Accra
expose_php = Off
; Error logs never show what a function was given (a customer's phone, a PIN) - E9.6 review F4.
zend.exception_ignore_args = On

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
